# Gradle properties
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Suppress Gradle warnings
org.gradle.warning.mode=summary

# braintrust-spec git ref (SHA or tag) used by btx tests
braintrustSpecRef=c3c80aa77cc722164dc6748400853b9a5b2512be

# braintrust-openapi commit SHA used by braintrust-api
braintrustOpenApiRef=4cc0615694512d6e77fce6bff2c70d1531208daa

# Let Gradle locate local JDKs and download one if needed
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
