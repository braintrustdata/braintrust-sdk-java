plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

// ---- Isolated client source sets ---------------------------------------------
// Some client libraries cannot share the test classpath: different major/minor versions
// of the same library reuse Maven coordinates and package names. Those clients get their
// own source set, compiled against the conflicting version and executed inside a
// child-first classloader at test runtime (see SpecClient.isolation() /
// IsolatedClientDelegate). Each source set's runtime classpath is handed to the test JVM
// via a btx.<name>.classpath system property below.
//
//   springai2   - Spring AI 2.x (main test classpath has 1.x)
//   langchain18 - langchain4j < 1.14.0, driving the langchain_1_8_0 instrumentation module
//                 (main test classpath has 1.19.0 + langchain_1_14_0). Keeps the older
//                 module under btx spec coverage even though the two langchain4j lines
//                 cannot coexist.
sourceSets {
    springai2
    langchain18
}

dependencies {
    // Shared spec-runner types (SpecClient, LlmSpanSpec, SpecClientContext, ...) resolve
    // through the parent loader at runtime, so they are compile-only here.
    springai2CompileOnly sourceSets.test.output
    springai2CompileOnly(testFixtures(project(':test-harness')))

    springai2Implementation project(':braintrust-sdk:instrumentation:springai_2_0_0')
    springai2Implementation 'org.springframework.ai:spring-ai-openai:2.0.0'
    springai2Implementation 'org.springframework.ai:spring-ai-anthropic:2.0.0'
    springai2Implementation "io.opentelemetry:opentelemetry-api:${rootProject.ext.otelVersion}"
    springai2Implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
    springai2RuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    // langchain4j < 1.14.0 (pre-Responses-API) against the langchain_1_8_0 module. Pinned to
    // 1.9.1, the version btx exercised before langchain_1_14_0 existed; must stay < 1.14.0 or
    // the module's classLoaderMatcher gate (and this source set's whole purpose) is moot.
    langchain18CompileOnly sourceSets.test.output
    langchain18CompileOnly(testFixtures(project(':test-harness')))

    langchain18Implementation project(':braintrust-sdk:instrumentation:langchain_1_8_0')
    langchain18Implementation 'dev.langchain4j:langchain4j:1.9.1'
    langchain18Implementation 'dev.langchain4j:langchain4j-http-client:1.9.1'
    langchain18Implementation 'dev.langchain4j:langchain4j-open-ai:1.9.1'
    langchain18Implementation "io.opentelemetry:opentelemetry-api:${rootProject.ext.otelVersion}"
    langchain18Implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
    langchain18RuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

dependencies {
    // Braintrust SDK (local project dependencies)
    testImplementation project(':braintrust-sdk')
    testImplementation project(':braintrust-sdk:instrumentation:openai_2_15_0')
    testImplementation project(':braintrust-sdk:instrumentation:anthropic_2_2_0')
    testImplementation project(':braintrust-sdk:instrumentation:genai_1_18_0')
    testImplementation project(':braintrust-sdk:instrumentation:langchain_1_14_0')
    testImplementation project(':braintrust-sdk:instrumentation:springai_1_0_0')
    testImplementation project(':braintrust-sdk:instrumentation:aws_bedrock_2_30_0')

    // Jackson for JSON processing
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'

    // OpenAI SDK
    testImplementation 'com.openai:openai-java:2.8.1'

    // Anthropic SDK
    testImplementation 'com.anthropic:anthropic-java:2.10.0'

    // AWS Bedrock SDK
    testImplementation 'software.amazon.awssdk:bedrockruntime:2.30.0'
    testImplementation 'software.amazon.awssdk:netty-nio-client:2.30.0'

    // Gemini SDK
    testImplementation 'org.springframework.ai:spring-ai-google-genai:1.1.0'

    // Spring AI (OpenAI + Anthropic providers)
    testImplementation 'org.springframework.ai:spring-ai-openai:1.1.3'
    testImplementation 'org.springframework.ai:spring-ai-anthropic:1.1.3'
    testRuntimeOnly 'org.springframework:spring-webflux:6.2.3'
    testRuntimeOnly 'io.projectreactor.netty:reactor-netty-http:1.2.3'
    testImplementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'

    // LangChain4j — 1.14.0+ ships the OpenAI Responses API (OpenAiResponsesChatModel), which the
    // langchain_1_14_0 module instruments. Pinned to a recent 1.x for the responses spec coverage.
    testImplementation 'dev.langchain4j:langchain4j:1.19.0'
    testImplementation 'dev.langchain4j:langchain4j-http-client:1.19.0'
    testImplementation 'dev.langchain4j:langchain4j-open-ai:1.19.0'

    // OpenTelemetry
    testImplementation 'io.opentelemetry:opentelemetry-api:1.54.1'

    // YAML parsing for spec files
    testImplementation 'org.yaml:snakeyaml:2.3'

    // Test framework
    testImplementation(testFixtures(project(":test-harness")))
    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.ext.junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${rootProject.ext.junitVersion}"
    testImplementation "io.opentelemetry:opentelemetry-sdk:${rootProject.ext.otelVersion}"
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    workingDir = rootProject.projectDir

    // Hand the isolated client classpaths to the test JVM (resolved lazily so configuration
    // time doesn't force dependency resolution).
    dependsOn tasks.named('springai2Classes'), tasks.named('langchain18Classes')
    doFirst {
        systemProperty 'btx.springai2.classpath',
            (sourceSets.springai2.output.classesDirs + configurations.springai2RuntimeClasspath).asPath
        systemProperty 'btx.langchain18.classpath',
            (sourceSets.langchain18.output.classesDirs + configurations.langchain18RuntimeClasspath).asPath
    }
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat "full"
    }

    // Pass -Pbtx.spec.filter=<glob> to pre-filter which specs are executed before JUnit runs.
    // Example: ./gradlew btx:test -Pbtx.spec.filter=openai
    if (project.hasProperty('btx.spec.filter')) {
        systemProperty 'btx.spec.filter', project.property('btx.spec.filter')
    }
}

def specRef = project.property('braintrustSpecRef')
def specOutputDir = layout.buildDirectory.dir("spec")

tasks.register('fetchSpec', Exec) {
    description = 'Fetches braintrust-spec YAML files for the pinned ref.'

    inputs.property('specRef', specRef)
    outputs.dir(specOutputDir)

    def outDir = specOutputDir.get().asFile
    doFirst {
        delete(outDir)
        mkdir(outDir)
    }
    commandLine 'bash', "${rootProject.projectDir}/scripts/spec-fetch.sh", specRef, outDir.absolutePath
}

test {
    // BTX_SPEC_ROOT env var lets you point at a local checkout of braintrust-spec instead of the
    // fetched copy. When set, fetchSpec is skipped and the system property is set to that path.
    // Example: BTX_SPEC_ROOT=/Users/you/braintrust/spec/test/llm_span ./gradlew btx:test
    def specRootEnv = System.getenv('BTX_SPEC_ROOT')
    if (specRootEnv) {
        systemProperty 'btx.spec.root', specRootEnv
    } else {
        dependsOn fetchSpec
        systemProperty 'btx.spec.root', specOutputDir.get().asFile.absolutePath + '/test/llm_span'
    }
}
